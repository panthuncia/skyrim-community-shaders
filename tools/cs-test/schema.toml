[key."dclf.accumulated_parity"]
env = "CS_DCLF_ACCUMULATED_PARITY"
type = "bool"
default = false
family = "dclf"
kind = "parity"
owner = "core"
description = "1: T7b1/T7b2 observers: DCLF's decoded visibility against the engine's kAccumulated on the listed roots and their geometry, frame by frame (<- ACCUMULATED), and FUN_1402cff60's animation gate on the stood-in roots against DCLF's writes (<- ANIM RATE); off: the readback and the writes still run"

[key."dclf.actors"]
env = "CS_DCLF_ACTORS"
type = "bool"
default = true
family = "dclf"
kind = "feature"
sweep = true
owner = "Actors"
description = "0: actors stay native (live toggle's seed)"

[key."dclf.async_compute"]
env = "CS_DCLF_ASYNC_COMPUTE"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "core"
description = "0: the passes that prefer the compute queue (build-draws' queries, fades, portal batches, tree wind) run on the graphics queue"

[key."dclf.async_priority"]
env = "CS_DCLF_ASYNC_PRIORITY"
type = "string"
family = "dclf"
kind = "feature"
owner = "core"
description = "normal: the coordinator and scene threads keep normal priority instead of above normal (and frame-critical jobs run at normal); noboost: workers are not raised to a ParallelFor caller's priority while they hold its chunks, nor for frame-critical jobs (the CPU pipeline's culls)"

[key."dclf.billboard_particles"]
env = "CS_DCLF_BILLBOARD_PARTICLES"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "Billboards"
description = "default on (T7f item 7): particle systems under NiBillboardNodes (the magic hands' fire cores and embers) drawn by DCLF's particle path like any other (their world and particles are their last update's; needs CS_DCLF_BILLBOARDS and CS_DCLF_PARTICLES); 0 they stay the engine's (billboard)"

[key."dclf.billboards"]
env = "CS_DCLF_BILLBOARDS"
type = "bool"
default = true
family = "dclf"
kind = "feature"
sweep = true
owner = "Billboards"
description = "1: effect-shader meshes under an NiBillboardNode (fire cards, spray jets) drawn by DCLF, turned to each view's camera in the vertex stage as NiBillboardNode::OnVisible turns the node (needs CS_DCLF_EFFECTS); 0 they stay native (live toggle's seed)"

[key."dclf.build_parity"]
env = "CS_DCLF_BUILD_PARITY"
type = "bool"
default = false
family = "dclf"
kind = "parity"
owner = "core"
description = "1: the build cache against a fresh build"

[key."dclf.capture_parity"]
env = "CS_DCLF_CAPTURE_PARITY"
type = "bool"
default = false
family = "dclf"
kind = "parity"
owner = "core"
description = "1: the tables against the engine's own lighting draws (run with CS_DCLF_PARITY_BOTH=1, so the engine draws what DCLF draws)"

[key."dclf.capture_point_parity"]
env = "CS_DCLF_CAPTURE_POINT_PARITY"
type = "bool"
default = false
family = "dclf"
kind = "parity"
owner = "core"
description = "1: the colour epoch's captured bindings against the frame's first native lighting draw"

[key."dclf.census"]
env = "CS_DCLF_CENSUS"
type = "bool"
default = false
family = "dclf"
kind = "diagnostic"
owner = "core"
description = "1: T7a's census, every report: what the engine still draws (the passes registered and not withheld) per view and class (DCLF's verdict for Lighting geometry; shader type and RTTI otherwise)"

[key."dclf.change_log_parity"]
env = "CS_DCLF_CHANGE_LOG_PARITY"
type = "bool"
default = false
family = "dclf"
kind = "parity"
owner = "core"
description = "1: the change log against a diff of the tables"

[key."dclf.cpu_batch"]
env = "CS_DCLF_CPU_BATCH"
type = "string"
family = "dclf"
kind = "feature"
owner = "core"
description = "the CPU pipeline's batch lanes (default 4096, rounded up to a multiple of 8; the live setting's seed: dclf:cpu-batch, the menu)"

[key."dclf.cpu_cadence"]
env = "CS_DCLF_CPU_CADENCE"
type = "string"
family = "dclf"
kind = "feature"
owner = "core"
description = "frame|snapshot, or <view>=frame|snapshot,...: the CPU pipeline's views culled and recorded every frame (default) or once per snapshot (main is always per frame; live toggles' seeds)"

[key."dclf.cpu_record"]
env = "CS_DCLF_CPU_RECORD"
type = "string"
family = "dclf"
kind = "feature"
owner = "core"
description = "indirect|serial|parallel (default: serial on NVIDIA, indirect elsewhere): the CPU pipeline's per-frame views as indirect draws the cull jobs write, recorded by DXVK's CS thread, or into a secondary list per batch on the pool (live toggle's seed)"

[key."dclf.cull"]
env = "CS_DCLF_CULL"
type = "enum"
choices = ["off", "frustum", "occlusion"]
default = "occlusion"
family = "dclf"
kind = "feature"
owner = "core"
description = "off|frustum|occlusion (default): GPU culling, the live toggle's seed"

[key."dclf.decal_plain"]
env = "CS_DCLF_DECAL_PLAIN"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "core"
description = "0: the decal groups draw device-generated, a call per state class (the engine's order within a class), instead of a plain draw per pipeline (the engine's order within a pipeline)"

[key."dclf.decals"]
env = "CS_DCLF_DECALS"
type = "bool"
default = true
family = "dclf"
kind = "feature"
sweep = true
owner = "Decals"
description = "0: decals stay native (live toggle's seed)"

[key."dclf.depth_trace"]
env = "CS_DCLF_DEPTH_TRACE"
type = "bool"
default = false
family = "dclf"
kind = "diagnostic"
owner = "core"
description = "1: the D3D11 calls that touch the main depth buffer, for five frames"

[key."dclf.draw_trace"]
env = "CS_DCLF_DRAW_TRACE"
type = "bool"
default = false
family = "dclf"
kind = "diagnostic"
owner = "core"
description = "1: the callers of the D3D11 draws"

[key."dclf.effect_cloud_light"]
env = "CS_DCLF_EFFECT_CLOUD_LIGHT"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "Effects"
description = "default on: effect meshes with kEffectLighting and kCloudLOD (lit by the cloud light, not the sun) drawn by DCLF with the cloud light's colour as a frame row (needs CS_DCLF_EFFECTS); 0 they stay native (cloud-lighting)"

[key."dclf.effect_falloff"]
env = "CS_DCLF_EFFECT_FALLOFF"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "Effects"
description = "default on: effect meshes with Falloff and no blending alpha property (the engine's hint 1, unblended while their alpha is one) drawn by DCLF's forward epoch unblended, sorted with the blended objects (needs CS_DCLF_EFFECTS and CS_DCLF_FORWARD); 0 they stay native (effect-opaque)"

[key."dclf.effect_rigid_skins"]
env = "CS_DCLF_EFFECT_RIGID_SKINS"
type = "bool"
default = false
family = "dclf"
kind = "feature"
owner = "Effects"
description = "1: effect meshes with a skin instance whose pass has no Skinned bit (the property without kSkinned: dog eyes) drawn by DCLF, each partition with the unskinned vertex stage and the geometry's world, as the engine draws them (needs CS_DCLF_EFFECTS and CS_DCLF_SKINNED); 0 (default) they stay native (effect-variant (skinned))"

[key."dclf.effects"]
env = "CS_DCLF_EFFECTS"
type = "bool"
default = true
family = "dclf"
kind = "feature"
sweep = true
owner = "Effects"
description = "1: static blended BSEffectShaderProperty meshes drawn by DCLF's forward epoch, sorted with blended Lighting (T7d's Effect port; needs CS_DCLF_FORWARD); 0 they stay native (live toggle's seed)"

[key."dclf.empty_fade_node"]
env = "CS_DCLF_EMPTY_FADE_NODE"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "Fades"
description = "default on (T7f item 7): the engine's empty fade node (the BSFadeNode 0x14332a2a0 holds, which every BSShaderProperty starts with and the engine reads as none) is no fade root: such geometry (terrain, object LOD, some clutter) takes its entry's root; 0: it is listed as one fade root of all of them, outside the scene graph"

[key."dclf.enabled"]
env = "CS_DCLF"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "core"
description = "false: DCLF does not install"

[key."dclf.fade_parity"]
env = "CS_DCLF_FADE_PARITY"
type = "bool"
default = false
family = "dclf"
kind = "parity"
owner = "Fades"
description = "1: the fade port against the engine's functions, and FadeStateCS against the port"

[key."dclf.fanout"]
env = "CS_DCLF_FANOUT"
type = "string"
family = "dclf"
kind = "feature"
owner = "core"
description = "the scene pass's evaluation rounds and joins (T6b3e): 0 interleaved on the scene lane (the reference), 1 every entry evaluated then merged, on the lane; 2 (default) evaluated on the preparation pool from 128 entries, merged in order"

[key."dclf.first_person"]
env = "CS_DCLF_FIRST_PERSON"
type = "bool"
default = true
family = "dclf"
kind = "feature"
sweep = true
owner = "FirstPerson"
description = "default on: the player's first-person arms, weapons and magic hands drawn by DCLF as a view of the one scene (T7e: kSetFirstPerson members, the view bit kViewFirstPerson at the GPU cull, its depth in the Z-prepass epoch and a colour epoch at Main::RenderFirstPersonView); 0 they stay native (live toggle's seed)"

[key."dclf.first_person_decals"]
env = "CS_DCLF_FIRST_PERSON_DECALS"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "FirstPerson"
description = "default on (T7f item 7): a decal on a first-person entry (an effect's skinned blood decal on the arms, a weapon's BloodLighting) drawn by the first-person forward part as a forward object with its decal group's depth bias, test and blend (needs CS_DCLF_FIRST_PERSON and CS_DCLF_DECALS); 0 it stays the engine's"

[key."dclf.foliage_parity"]
env = "CS_DCLF_FOLIAGE_PARITY"
type = "bool"
default = false
family = "dclf"
kind = "parity"
owner = "core"
description = "1: the alpha-tested colour draws' pixels (object, albedo, diffuse) against the frame before's, tree wind frozen; wind: not frozen"

[key."dclf.forward"]
env = "CS_DCLF_FORWARD"
type = "bool"
default = true
family = "dclf"
kind = "feature"
sweep = true
owner = "Forward"
description = "1: blended Lighting geometry drawn by DCLF's forward epoch (T7d: a GPU depth sort, back to front, before the engine's blended draws); 0 it stays native (live toggle's seed)"

[key."dclf.forward_direct"]
env = "CS_DCLF_FORWARD_DIRECT"
type = "bool"
default = true
family = "dclf"
kind = "feature"
owner = "core"
description = "0: the GPU-driven graph keeps its forward family (blended, refraction, first person's forward part) on the GPU, sorted per pipeline, instead of the CPU pipeline"

[key."dclf.forward_plain"]
env = "CS_DCLF_FORWARD_PLAIN"
type = "bool"
default = true
family = "dclf"
