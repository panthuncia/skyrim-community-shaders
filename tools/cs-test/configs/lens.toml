# Physical Lens image effects (distortion, vignetting, colour fringing) A/B: the lens on with ghosts (Intensity 0) and the
# diffraction starburst off, the settings the ORG chain implements. A 24 mm lens wide open (Canon RF 24-70, preset 5), where the
# effects are strong; ImageEffects off for the first shot, on for the second. Cinematic Camera must stay off (it drives the lens).
# The wait covers D3D11's on-demand compile of Composite's lens variant. Compose it: guest+lens, native-vulkan+lens, d3d11+lens.
extends = ["base"]

[run]
timeout_s = 300

[features]
PostProcessing = true

# The chain runs only in Post Processing mode. The test profile saves "Vanilla", which bypasses it.
[saved_settings.General]
"Post Processing Mode" = "PostProcessing"

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 30
do = "setting"
arg = 'PostProcessing.Physical Lens={"enabled":true,"settings":{"LensPreset":5,"ZoomPosition":0.0,"FNumber":1.0,"FocusDistanceM":0,"Intensity":0.0,"Diffraction":false,"ImageEffects":false}}'

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "flat"

# On the render graph a run's first shot is copied only once a build that holds the copy switches in, some frames after the
# shot step (22 capture points on native Vulkan). The next setting must come after that, or the "flat" shot shows the lens.
[[steps]]
at = "previous"
frames = 60
do = "setting"
arg = 'PostProcessing.Physical Lens={"enabled":true,"settings":{"LensPreset":5,"ZoomPosition":0.0,"FNumber":1.0,"FocusDistanceM":0,"Intensity":0.0,"Diffraction":false,"ImageEffects":true}}'

[[steps]]
at = "previous"
frames = 600
do = "shot"
arg = "lens"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["flat", "lens"]

shot_refs = ["flat", "lens"]