# The main menu's model (MistMenu, UI3DSceneManager::Render scheme 4): the autoload mod is off, so the game waits at the main
# menu; a shot there, the detector tables, then exit. Compose it: native-vulkan+menu-main, guest+menu-main.
extends = ["base"]

[run]
timeout_s = 300

[game]
mods_off = ["Skyrim Engine Telemetry", "Start On Save"]

[[steps]]
at = "main-menu"
frames = 240
do = "shot"
arg = "main-menu"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "main-menu-b"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "main-menu"
shots = ["main-menu", "main-menu-b"]
