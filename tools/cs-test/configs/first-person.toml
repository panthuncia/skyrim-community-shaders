# The autoloaded save in third person, then in first person, a shot of each. Compose it: guest+first-person,
# native-vulkan+first-person.
extends = ["base"]

[game]
# Improved Camera SE shows the third-person body in first person (its SetFirstPerson detour patches the hide). Native runs
# turn it off (native-vulkan), so guest turns it off here too: both modes then draw the same player.
mods_off = ["Skyrim Engine Telemetry", "ImprovedCameraSE"]

[run]
timeout_s = 300

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 30
do = "pov"
arg = "third"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "third"

[[steps]]
at = "previous"
frames = 1
do = "pov"
arg = "first"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "first"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["third", "first"]

shot_refs = ["third", "first"]