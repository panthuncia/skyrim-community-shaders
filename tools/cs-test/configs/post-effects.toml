# The post chain's effects toggled and changed after world-ready, a shot after each change (frame revision plan 6.9).
# The chain runs only in Post Processing mode, so [saved_settings] sets it for the run.
# Each change is a CS::Setting event. A change of a pass list or size builds the chain when the next revision starts; a change
# of a value only (Mip Blend Factor 3, a blend that keeps the used mip count) must build nothing.
# The log must show "chain N built for the next revision" once per structural change and "the chain runs on the render graph"
# after it, and no "the chain could not be built" or "stale recording" line.
# Compose it: guest+post-effects, native-vulkan+post-effects, native-d3d12+post-effects (and d3d11+post-effects for reference shots).
extends = ["base"]

[run]
timeout_s = 420

[features]
PostProcessing = true

# The chain runs only in Post Processing mode. The test profile saves "Vanilla", which bypasses it.
[saved_settings.General]
"Post Processing Mode" = "PostProcessing"

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "pp-base"

# COD Bloom: a factor that keeps the used mips (no build), then the last mip's factor, which adds a mip (a build).
[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.CODBloom.MipBlendFactor[3]=0.2"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "bloom-blend"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.CODBloom.MipBlendFactor[7]=0.5"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "bloom-mips"

# Depth of Field on, then its gather ring count, the compatibility blur, and back to the gather.
[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.DepthofField.enabled=true"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "dof-on"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.DepthofField.GatherQuality=1"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "dof-rings"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.DepthofField.UseAdaptiveGather=false"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "dof-legacy"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.DepthofField.enabled=false"

# Physical Glare on, then a smaller FFT (a new version of its declared textures), then the pupil aperture.
[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.PhysicalGlare.enabled=true"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "glare-on"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.PhysicalGlare.FFTResolution=256"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "glare-fft"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.PhysicalGlare.ApertureMode=1"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "glare-pupil"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.PhysicalGlare.enabled=false"

# Lens Flare's ghost mode and FFT size.
[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.LensFlare.GhostModeInt=2"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "flare-mode"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.LensFlare.FFTResolution=256"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "flare-fft"

# Motion Blur, Vignette, Border and Local Exposure on and off: the effect list.
[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.MotionBlur.enabled=true"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.Border.enabled=true"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "list-on"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.Vignette.enabled=false"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "PostProcessing.LocalExposure.enabled=false"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "list-off"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["pp-base", "bloom-blend", "bloom-mips", "dof-on", "dof-rings", "dof-legacy", "glare-on", "glare-fft", "glare-pupil", "flare-mode",
	"flare-fft", "list-on", "list-off"]
no_log = ["the chain could not be built", "stale recording", "fatal: frame declaration:", "missed settings writer:", "the chain runs on D3D11",
	"fatal: Post Processing:", "the post stage will never hold the chain"]

# The chain never runs on D3D11 in graph mode: a frame without a held build draws no chain (phase 6 holds). It runs on the graph
# in most frames of the run.
[expect.graph_frames]
min = { "cs.pp" = 300 }

shot_refs = ["pp-base", "bloom-blend", "bloom-mips", "dof-on", "dof-rings", "dof-legacy", "glare-on", "glare-fft", "glare-pupil", "flare-mode", "flare-fft", "list-on", "list-off"]