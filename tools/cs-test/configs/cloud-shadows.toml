# Cloud Shadows under a locked storm (cloud layers drawn into the reflection faces), its opacity changed and back, then a
# coc into Dragonsreach (no full sky, so no occlusion copy) and back out to Whiterun. The layers and the occlusion cubemap
# follow the engine's reflection cubemap, which the engine makes once a session, so the occlusion copy's client is registered
# once, by the frame revision after setup (frame revision plan, 6.18). Opacity is a constant, so none of this may make a new
# registration, a stale recording or a structural rebuild. Compose it: native-vulkan+cloud-shadows,
# native-d3d12+cloud-shadows, guest+cloud-shadows.
extends = ["base"]

[run]
timeout_s = 480

[features]
CloudShadows = true

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the storm locked (the CS weather lock: it holds against the climate, where fw depends on frame timing).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "000C8220"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 330
do = "shot"
arg = "clouds"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "CloudShadows.Opacity=2.0"

[[steps]]
at = "previous"
frames = 150
do = "shot"
arg = "clouds-opaque"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "CloudShadows.Opacity=0.5"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "interior"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc Whiterun"

[[steps]]
at = "world-ready"
frames = 300
do = "shot"
arg = "exterior"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["clouds", "clouds-opaque", "interior", "exterior"]
no_log = ["frame tap error"]

# The client ran on the render graph (the game's graph frame counts at exit; skipped in plain D3D11 mode).
[expect.graph_frames]
min = { "cs.cloud-shadows" = 60 }

shot_refs = ["clouds", "clouds-opaque", "exterior"]   # not interior: Dragonsreach's hearth fire is a ceiling-high orange column in native (post-refs.md, B1)