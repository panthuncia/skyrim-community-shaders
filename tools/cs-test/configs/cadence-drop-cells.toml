# The cadence test mode's drop:3 (cadence-drop.toml) through cell loads: three coc steps, each into new cells (Whiterun's
# exterior, Dragonsreach, Riverwood), a shot once each settles, then exit. Checks the game-side side effects
# (Snapshot/SideEffects.h) where cells, actors, decals, fades after a teleport and the flow-map pool are exercised.
# Native only. Compose it: native-vulkan+cadence-drop-cells. Each shot is 120 game frames (40 rendered frames) after its
# load's world-ready, past the fade-in.
extends = ["base"]

[run]
timeout_s = 420

[snapshot]
cadence = "drop:3"

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 60
do = "console"
arg = "coc Whiterun"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "whiterun"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "riverwood"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["whiterun", "dragonsreach", "riverwood"]

shot_refs = ["whiterun", "riverwood"]   # not dragonsreach: native's hearth fire column (post-refs.md, B1)