# The wait holds the shot until the reload finished and a frame revision adopted its pipeline generation.
[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "after"
wait = "reload"
wait_s = 120

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["before", "after"]
no_log = ["frame tap error", "fatal: frame revision:", "shader reload: every graph asked for", "graph failed to prepare",
	"binds a version the frame does not read", "shader-reload wait", "graph built on the render thread after the first world frame"]
