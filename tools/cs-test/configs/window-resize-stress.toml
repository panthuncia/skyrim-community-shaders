# Six window resizes in one run (1920x1080 <-> 1280x720, 90 frames each), a shot after each. The intermittent native device loss after
# a resize (decision 94) shows within two cycles here; it needs Light Limit Fix on. Compose it: native-vulkan+window-resize-stress.
extends = ["base"]

[run]
timeout_s = 420

[[steps]]
at = "world-ready"
frames = 60
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1280x720"

[[steps]]
at = "previous"
frames = 90
do = "shot"
arg = "small0"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1920x1080"

[[steps]]
at = "previous"
frames = 90
do = "shot"
arg = "large0"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1280x720"

[[steps]]
at = "previous"
frames = 90
do = "shot"
arg = "small1"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1920x1080"

[[steps]]
