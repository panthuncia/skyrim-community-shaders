# Scaleform displays beyond the HUD: the inventory, the world map and the console, each opened through the UI message queue
# (no input), a shot in each, then exit. Native runs log the UI stream's parity census ("[ORG] Scaleform parity").
# Compose it: guest+ui-menus, native-vulkan+ui-menus, native-d3d12+ui-menus.
extends = ["base"]

[run]
timeout_s = 420

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "hud"

[[steps]]
at = "previous"
frames = 1
do = "menu"
arg = "InventoryMenu=show"

[[steps]]
at = "previous"
frames = 180
do = "shot"
arg = "inventory"

[[steps]]
at = "previous"
frames = 1
do = "menu"
arg = "InventoryMenu=hide"

[[steps]]
at = "previous"
frames = 60
do = "menu"
arg = "MapMenu=show"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "map"

[[steps]]
at = "previous"
frames = 1
do = "menu"
arg = "MapMenu=hide"

[[steps]]
at = "previous"
frames = 60
do = "menu"
arg = "Console=show"

[[steps]]
at = "previous"
frames = 60
do = "shot"
arg = "console"

[[steps]]
at = "previous"
frames = 1
do = "menu"
arg = "Console=hide"

[[steps]]
at = "previous"
frames = 30
do = "exit"

[expect]
reach = "world-ready"
shots = ["hud", "inventory", "map", "console"]

shot_refs = ["hud", "inventory", "map", "console"]