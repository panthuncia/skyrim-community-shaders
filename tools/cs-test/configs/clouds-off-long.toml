# As clouds-long with the clouds left off: the baseline for comparing modes at the same frames.
# Compose it: guest+clouds-off-long, d3d11+clouds-off-long.
extends = ["base"]

[run]
timeout_s = 600

[features]
PhysicalSky = true

[[steps]]
at = "world-ready"
frames = 30
do = "setting"
arg = "PhysicalSky.enableVolumetricClouds=false"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "clouds"

[[steps]]
at = "previous"
frames = 6000
do = "shot"
arg = "clouds-late"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["clouds", "clouds-late"]
