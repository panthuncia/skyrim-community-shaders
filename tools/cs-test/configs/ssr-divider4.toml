# The SSR mask's compute downsample (ISDownsampleIgnoreBrightestCS): iReflectionResolutionDivider 4 makes RenderReflections use it
# instead of the raster downsample (AE 107146). Set at runtime, so the engine's targets keep their divider-2 sizes; the path is the
# same. Riverwood's river at noon (river.toml), a shot down at the water and one along it. Compose it: guest+ssr-divider4,
# native-vulkan+ssr-divider4, d3d11+ssr-divider4.
extends = ["base"]

[run]
timeout_s = 420

[[steps]]
at = "world-ready"
frames = 200
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = 'setini "iReflectionResolutionDivider:Display" 4'

[[steps]]
at = "previous"
frames = 20
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 60
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

[[steps]]
at = "previous"
frames = 390
do = "shot"
arg = "river"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 290
do = "shot"
arg = "river-east"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["river", "river-east"]
no_log = ["frame tap error"]
