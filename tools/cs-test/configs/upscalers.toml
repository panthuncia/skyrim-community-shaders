# Each upscale method in turn at the autoloaded save, a shot each (the "upscale" command), then exit. Compose it: guest+upscalers,
# native-vulkan+upscalers, native-d3d12+upscalers. Read the "[Streamline] ... evaluate result" and "[UPTEST]" lines.
extends = ["base"]

[run]
timeout_s = 360

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 200
do = "upscale"
arg = "dlss"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "dlss"

[[steps]]
at = "previous"
frames = 10
do = "upscale"
arg = "fsr"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "fsr"

[[steps]]
at = "previous"
frames = 10
do = "upscale"
arg = "xess"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "xess"

[[steps]]
at = "previous"
frames = 10
do = "upscale"
arg = "taa"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "taa"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["dlss", "fsr", "xess", "taa"]

shot_refs = ["dlss", "fsr", "xess", "taa"]