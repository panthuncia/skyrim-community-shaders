# The update-rate cap at 240 game updates a second (Advanced, Update Rate Cap; Snapshot::PaceGameUpdate): the game runs faster than the
# render side (render-thread roadmap phase 7, item 8). The autoloaded save: a shot once settled, one three updates after a turn and one
# once that settled, then exit. Step frames count game updates. Read the [Perf] lines for "rendered" against "game ... updates/s".
# The cap holds while the render thread renders routed updates (native); the render thread's own present sets the frame rate.
# Compose it: native-vulkan+update-cap240.
extends = ["base"]

[run]
timeout_s = 300

[saved_settings.Advanced]
"Update Rate Cap" = 240

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 3
do = "shot"
arg = "turn"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "settled"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["start", "turn", "settled"]

shot_refs = ["start", "turn", "settled"]