# Converted from tools/cs-ab/scenarios/rx6600-sweep.env. Old frame N became world-ready + (N - 100) for the first
# command, then each command at 'previous' plus the old gap.
# RX 6600: a camera sweep at the newest save to provoke device losses (hang markers on). The sweep driver
# moves the mouse side to side for a set time after tgm. tgm first: a wolf attacks the player at the newest
# save.
# The exit comes 7200 frames after tgm (about 90 s): the sweep driver (tools/cs-test/sweep.ps1) moves the mouse for 60 s of it.
extends = ["guest"]

[run]
exclusive = true             # every lab slot: sweep.ps1 moves the mouse in the focused game

[dxvk]
filter_device_name = "AMD Radeon RX 6600"

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 7200
do = "exit"

[expect]
reach = "world-ready"
