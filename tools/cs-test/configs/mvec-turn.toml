# Motion vectors while the player turns (snap7-mvec): at a 30 update cap the render side repeats each snapshot several times, so a
# shot lands on a repeat. The player turns 4 degrees each update and the camera follows, so the character stays put on screen while
# the world turns behind it. A repeated render must draw nothing moving (the last render drew the same snapshot): a previous
# palette or transform from the previous game update smears the character under TAA and the upscalers. Shots mid-turn with TAA,
# then DLSS; compare native-vulkan+mvec-turn with guest+mvec-turn and d3d11+mvec-turn (guest renders once per update).
extends = ["base"]

[run]
timeout_s = 360

[saved_settings.Advanced]
"Update Rate Cap" = 30

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
