# Riverwood's river at noon in clear weather: a shot down at the water (its reflection: the water reflection's cube faces) and one
# along it, then exit. Compose it: guest+river, native-vulkan+river, native-d3d12+river.
extends = ["base"]

[run]
timeout_s = 420

# God mode and AI off (the save is a guard fight; NPCs wander), so the shots compare with references.
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 199
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 20
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 60
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

[[steps]]
at = "previous"
frames = 390
do = "shot"
arg = "river"

# Flicker: consecutive rendered frames of the same view (cstest/flicker.py).
[[steps]]
at = "previous"
frames = 1
do = "burst"
arg = "river:60"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 290
do = "shot"
arg = "river-east"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["river", "river-east"]

shot_refs = ["river", "river-east"]

# Calibrated on d3d11 and guest at these scenes (post-flicker.md): their worst spike was 14.8 (Riverwood's turning water
# wheel at 25 frames a second), with at most 3 tiles flickering twice; native's flickering river reached 54 and 68-138 tiles.
[expect.flicker]
max_spike = 20
max_tiles = 8
