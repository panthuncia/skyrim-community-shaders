# Converted from the old dxc-slice scenarios: the DXC rollout's gate. One shader file through DXC against FXC: a shot and
# the GPU event timers at the autoloaded save. Old frames 1000/1500/2000/2010 became world-ready + 900, then the old gaps.
# FXC run: cs-test run dxc-slice. DXC run: add --set cs.shader_dxc=<regex>. DCLF off (the old dxc-slice) needs a mode without the graph, which runs only on DCLF's schedule.
extends = ["base"]

[cs]
gpu_event_timers = 500

[[steps]]
at = "world-ready"
frames = 900
do = "mark"
arg = "start"

[[steps]]
at = "previous"
frames = 500
do = "shot"
arg = "a"

[[steps]]
at = "previous"
frames = 500
do = "mark"
arg = "end"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["a"]
