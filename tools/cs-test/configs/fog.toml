# Exponential Height Fog and its volumetric fog turned on after world-ready, one shot, exit. The saved settings keep the fog off,
# so the quick configs never run it. Compose it: guest+fog, native-vulkan+fog, native-d3d12+fog, d3d11+fog.
extends = ["base"]

[run]
timeout_s = 300

[features]
ExponentialHeightFog = true

[[steps]]
at = "world-ready"
frames = 30
do = "setting"
arg = "ExponentialHeightFog.enabled=1"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "ExponentialHeightFog.volumetricFogEnabled=1"

[[steps]]
at = "previous"
frames = 150
do = "shot"
arg = "fog"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["fog"]
