# TAA's water form (ISTemporalAA_Water) at Riverwood's river (river.toml). Upscaling on TAA turns the game's TAA on, and the
# console's ToggleTAAWaterBlending (ttaaw) flips the TAA helper's water flag, which bTAAWater:Display sets at startup (default
# off), so the world TAA draws the water form from then on. Shots down at the water and along it. Compose it: guest+taa-water,
# native-vulkan+taa-water, d3d11+taa-water (the D3D11 reference).
extends = ["base", "river"]

[[steps]]
at = "world-ready"
frames = 200
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 20
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "previous"
frames = 900
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

[[steps]]
at = "previous"
frames = 10
do = "upscale"
arg = "taa"

[[steps]]
at = "previous"
frames = 60
do = "console"
arg = "ttaaw"

[[steps]]
at = "previous"
frames = 320
do = "shot"
arg = "river"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 290
do = "shot"
arg = "river-east"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["river", "river-east"]
# A step whose planned state differs from the engine's (CheckStepState) logs this once per effect.
no_log = ["frame tap error", "differs from the engine's state at its first draw"]
