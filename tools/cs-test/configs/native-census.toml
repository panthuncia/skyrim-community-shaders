# Native Vulkan, the autoloaded save, a short stay in the world, exit. The checks that were census reports are tap errors in
# development builds: work the immediate context runs outside the ledgers (OutsideLedgers) and raw bindless indices or buffer refs
# no pass declared (UndeclaredAccess). Either stops the game, so the run must reach the shot and log no "frame tap error".
# The "[ORG] boundary:" line's session part must show late changes 0.
extends = ["native-vulkan", "quick"]

[[steps]]
at = "world-ready"
frames = 640
do = "shot"
arg = "census"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["census"]
# Rule R1 (frame revision plan, late changes): no registration or build request inside a frame. The site line appears only when one came.
no_log = ["frame tap error", "session late changes by site"]
