# Dynamic resolution as viewports (frame revision plan, step 8). For DLSS, FSR and XeSS in turn: quality 1, a shot, then quality
# mode changes through the setting step (3, 1, 3, 2, 1, 4, 1, 0, 1, some on consecutive frames), with shots at quality 4, 0 and
# back at 1. Time is stopped, so the shots of one quality compare across methods' passes and against a build before step 8.
# Compose it: native-vulkan+dynres, native-d3d12+dynres, guest+dynres.
#
# Read in the log after each quality change: the "[ORG] frame revision N: adopted" lines carry the variables (Setting.Upscaling.qualityMode,
# DynamicRatios, RenderSize, UpscalerOptions) with "twins []", "staged builds 0" and "member stages [none]". No "[ORG] frame declaration:
# client ... registered" and no "[ORG] ImageSpace: ... are CS passes" line follows a quality change; they follow only the upscale steps.
extends = ["base"]

[run]
timeout_s = 600

[[steps]]
at = "world-ready"
frames = 300
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 60
do = "upscale"
arg = "dlss"

[[steps]]
at = "previous"
frames = 60
do = "setting"
arg = "Upscaling.qualityMode=1"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "dlss-q1"

[[steps]]
