# menu-scenes with Terrain Blending off at boot. A feature off at boot changes the shader defines, so CS's shader cache compiles
# on demand: the menu scenes' draws must wait for their shaders (left out of a render), not fail. Compose it:
# native-vulkan+menu-scenes-no-tb, guest+menu-scenes-no-tb.
extends = ["menu-scenes"]

[features]
TerrainBlending = false

[expect]
shot_refs = []   # the shots are menu-scenes'; this config checks that the scenes draw without a fatal
