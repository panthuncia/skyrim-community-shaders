# VRAM growth trace at Riverwood's river (river.toml's route) with CS_VRAM_DEBUG's ledger and the kernel probe.
# A vram-json dump after world-ready, after the coc, and every 300 frames at the river; the growth between dumps names the owner.
# Compose it: native-d3d12+vram-leak-river, guest+vram-leak-river.
extends = ["base"]

[run]
exclusive = true             # every lab slot: VRAM numbers, so no other game shares the GPU's memory
timeout_s = 480

[cs]
vram_debug = true

[env]
CS_AB_PROBE = "1"

[[steps]]
at = "world-ready"
frames = 100
do = "vram-json"

[[steps]]
at = "previous"
frames = 100
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 20
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 300
do = "vram-json"

[[steps]]
at = "previous"
frames = 600
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

[[steps]]
at = "previous"
frames = 300
do = "vram-json"

[[steps]]
at = "previous"
frames = 90
do = "shot"
arg = "river"

[[steps]]
at = "previous"
frames = 210
do = "vram-json"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 290
do = "vram-json"

[[steps]]
at = "previous"
frames = 10
do = "shot"
arg = "river-east"

[[steps]]
at = "previous"
frames = 300
do = "vram-json"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["river", "river-east"]
