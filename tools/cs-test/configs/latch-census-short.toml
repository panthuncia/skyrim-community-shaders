# A guest tour: Whiterun, the inventory, map and journal, a save and its load, then Dragonsreach.
# In graph mode the engine's context keeps binds and drops draws. A game draw outside the engine's draw functions is an EngineDraw
# tap error, which stops a development build. Read "[ORG] engine draws: N frames:" for the dropped draws, and any
# "[ORG] engine draws: engine ... was dropped" [E] line for a draw no port takes.
extends = ["guest"]

[[steps]]
at = "world-ready"
frames = 500
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 99
do = "console"
arg = "coc Whiterun"

[[steps]]
at = "previous"
frames = 600
do = "console"
arg = "set timescale to 20"

[[steps]]
at = "previous"
frames = 10
do = "weather"
arg = "SkyrimClear_A"

[[steps]]
at = "previous"
frames = 90
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 99
do = "shot"
arg = "whiterun"

[[steps]]
at = "previous"
frames = 1
do = "vram-json"

[[steps]]
at = "previous"
frames = 1
do = "dclf:tex-stats"

[[steps]]
at = "previous"
frames = 98
do = "menu"
arg = "InventoryMenu=show"

[[steps]]
at = "previous"
frames = 200
do = "shot"
arg = "inventory"

[[steps]]
at = "previous"
frames = 50
do = "menu"
arg = "InventoryMenu=hide"

[[steps]]
at = "previous"
frames = 100
do = "menu"
arg = "MapMenu=show"

[[steps]]
at = "previous"
frames = 250
do = "shot"
arg = "map"

[[steps]]
at = "previous"
frames = 50
do = "menu"
arg = "MapMenu=hide"

[[steps]]
at = "previous"
frames = 100
do = "menu"
arg = "Journal Menu=show"

[[steps]]
at = "previous"
frames = 150
do = "shot"
arg = "journal"

[[steps]]
at = "previous"
frames = 50
do = "menu"
arg = "Journal Menu=hide"

[[steps]]
at = "previous"
frames = 150
do = "save"
arg = "p4tour"

[[steps]]
at = "previous"
frames = 100
do = "load"
arg = "recent"

[[steps]]
at = "previous"
frames = 700
do = "shot"
arg = "loaded"

[[steps]]
at = "previous"
frames = 100
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "previous"
frames = 800
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 1
do = "vram-json"

[[steps]]
at = "previous"
frames = 99
do = "exit"

[expect]
reach = "world-ready"
shots = ["whiterun", "inventory", "map", "journal", "loaded", "dragonsreach"]
