# Converted from tools/cs-ab/scenarios/latch-census-short.env. Old frame N became world-ready + (N - 100) for the first
# command, then each command at 'previous' plus the old gap.
# latch-census.env without Blackreach and the race menu (fewer locations, less VRAM): Whiterun, the inventory, map and journal,
# a save and its load, then Dragonsreach. The Phase 5.5 working census; check with tools/cs-ab/census.py.
# p5-all-census-misc.env with the flush latch on (P5.13, docs/development/p5/flush.md "The latch" and "Allowed engine draws"). Against
# latch-census-off.env: the census's draws should be the same classes (allowed ones still reach D3D11), "[ORG] flush latch: N frames:"
# names the allowed draws by reason, and every "[ORG] flush latch: engine ... nobody vouched for it ... skipped" [E] line is a draw no
# port vouched for. Keep the switch lines in step with p5-all-census-misc.env.
extends = ["guest"]

[org]
ports = "all"
census = true

[[steps]]
at = "world-ready"
frames = 500
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 99
do = "console"
arg = "coc Whiterun"

[[steps]]
at = "previous"
frames = 600
do = "console"
arg = "set timescale to 20"

[[steps]]
at = "previous"
frames = 10
do = "weather"
arg = "SkyrimClear_A"

[[steps]]
at = "previous"
frames = 90
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 99
do = "shot"
arg = "whiterun"

[[steps]]
at = "previous"
frames = 1
do = "vram-json"

[[steps]]
at = "previous"
frames = 1
do = "dclf:tex-stats"

[[steps]]
at = "previous"
frames = 98
do = "menu"
arg = "InventoryMenu=show"

[[steps]]
at = "previous"
frames = 200
do = "shot"
arg = "inventory"

[[steps]]
at = "previous"
frames = 50
do = "menu"
arg = "InventoryMenu=hide"

[[steps]]
at = "previous"
frames = 100
do = "menu"
arg = "MapMenu=show"

[[steps]]
at = "previous"
frames = 250
do = "shot"
arg = "map"

[[steps]]
at = "previous"
frames = 50
do = "menu"
arg = "MapMenu=hide"

[[steps]]
at = "previous"
frames = 100
do = "menu"
arg = "Journal Menu=show"

[[steps]]
at = "previous"
frames = 150
do = "shot"
arg = "journal"

[[steps]]
at = "previous"
frames = 50
do = "menu"
arg = "Journal Menu=hide"

[[steps]]
at = "previous"
frames = 150
do = "save"
arg = "p4tour"

[[steps]]
at = "previous"
frames = 100
do = "load"
arg = "recent"

[[steps]]
at = "previous"
frames = 700
do = "shot"
arg = "loaded"

[[steps]]
at = "previous"
frames = 100
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "previous"
frames = 800
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 1
do = "vram-json"

[[steps]]
at = "previous"
frames = 99
do = "exit"

[expect]
reach = "world-ready"
shots = ["whiterun", "inventory", "map", "journal", "loaded", "dragonsreach"]
