# The VRAM cost of decision 6a (frame revision plan, step 8, "Measurement"): render-size textures are sized for the display.
# FSR at its lowest ratio (quality 4, a third per axis), two VRAM dumps; then native quality (0), two more. dclf:vram-json writes
# the previous snapshot, so the second dump of each pair is the one to read. Run it at a 3840x2160 display.
# Compose it: native-vulkan+dynres-vram. If FSR does not run on the device, change the upscale step's method.
extends = ["base"]

[run]
exclusive = true             # every lab slot: VRAM numbers, so no other game shares the GPU's memory
timeout_s = 420

[cs]
vram_debug = true

[org]
vram_source = "org"

[[steps]]
at = "world-ready"
frames = 300
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 10
do = "upscale"
arg = "fsr"

[[steps]]
at = "previous"
frames = 60
do = "setting"
arg = "Upscaling.qualityMode=4"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "q4"

[[steps]]
at = "previous"
frames = 10
do = "vram-json"

[[steps]]
at = "previous"
frames = 60
do = "vram-json"

[[steps]]
at = "previous"
frames = 10
do = "setting"
arg = "Upscaling.qualityMode=0"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "q0"

[[steps]]
at = "previous"
frames = 10
do = "vram-json"

[[steps]]
at = "previous"
frames = 60
do = "vram-json"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["q4", "q0"]
