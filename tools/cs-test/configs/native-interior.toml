# Dragonsreach interior: coc after world-ready, two shots a few seconds apart (adaptation settles), then Volumetric
# Lighting's size changes (a custom interior size, a coc back out) with a shot after each, exit. Native Vulkan.
extends = ["native-vulkan"]

# God mode first: a hostile NPC in the save can kill the player before the shots.
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

# AI off: the save's hostile guards follow into Dragonsreach and fight, which makes the shots differ between runs.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# The rest of the suite's pinned scene (see first-person-switch): combat off, time stopped at 13:00 (the sun shafts through
# Dragonsreach's windows move with the hour), the weather locked, the Health Low tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

[[steps]]
at = "previous"
frames = 30
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "dragonsreach2"

# Volumetric Lighting (frame revision plan 6.12): a custom interior size while inside is a new version of the volume, and the
# coc back out is another (the Interior variable). Each switches in with its revision; every frame has volumetric lighting.
[[steps]]
at = "previous"
frames = 10
do = "setting"
arg = 'VolumetricLighting.InteriorCustomSize={"Width":256,"Height":160,"Depth":60}'

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "VolumetricLighting.InteriorQuality=3"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "vl-custom"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc Whiterun"

# Clear weather: a random foggy weather outside hides the scene and fails the shot.
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "fw 81a"

# Where the player is after the coc (B5: the player once ended up below the land).
[[steps]]
at = "previous"
frames = 0
do = "place"
arg = "exterior +0"

[[steps]]
at = "previous"
frames = 30
do = "place"
arg = "exterior +30"

[[steps]]
at = "previous"
frames = 100
do = "place"
arg = "exterior +130"

[[steps]]
at = "previous"
frames = 270
do = "shot"
arg = "vl-exterior"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "VolumetricLighting.InteriorQuality=2"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["dragonsreach", "dragonsreach2", "vl-custom", "vl-exterior"]
shot_refs = ["dragonsreach", "dragonsreach2", "vl-custom", "vl-exterior"]
