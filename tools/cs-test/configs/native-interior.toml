# Dragonsreach interior: coc after world-ready, two shots a few seconds apart (adaptation settles), exit. Native Vulkan.
extends = ["native-vulkan"]

[env]
CS_ORG_EPOCH_STATS = "1"

[[steps]]
at = "world-ready"
frames = 30
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "previous"
frames = 600
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "dragonsreach2"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["dragonsreach", "dragonsreach2"]
