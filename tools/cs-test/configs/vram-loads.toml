# VRAM across loading screens: Riverwood, Dragonsreach, Riverwood, Riverwood, with two vram-json dumps after each settles.
# Each load resets the SSGI and Skylighting histories, so a version an adoption replaces must be released, not kept.
# dclf:vram-json writes the previous snapshot, so read the second dump of each pair. The log's "[ORG] versions released"
# lines count the replaced versions that went; "[ORG] versions: ... still held" names one that did not.
# Compose it with a mode: native-vulkan+vram-loads, native-d3d12+vram-loads, guest+vram-loads.
extends = ["base"]

[run]
exclusive = true             # every lab slot: VRAM numbers, so no other game shares the GPU's memory
timeout_s = 600

[cs]
vram_debug = true

[org]
vram_source = "org"

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 300
do = "vram-json"

[[steps]]
at = "previous"
frames = 60
do = "vram-json"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "world-ready"
frames = 60
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 300
do = "vram-json"

[[steps]]
at = "previous"
frames = 60
do = "vram-json"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "riverwood"

[[steps]]
at = "previous"
frames = 30
do = "vram-json"

[[steps]]
at = "previous"
frames = 60
do = "vram-json"

[[steps]]
at = "previous"
frames = 30
do = "exit"

[expect]
reach = "world-ready"
shots = ["riverwood"]
