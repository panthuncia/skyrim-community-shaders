# The snapshot cadence test mode (CS_SNAPSHOT_CADENCE, Snapshot/Publication.h), repeat:3: the render half runs three times for each game update, on
# one thread. Native only. The autoloaded save (the quick scene): a shot after settling, one three frames after a turn and one once it settled, then exit.
# Step frames count rendered frames (Presents). Compose it: native-vulkan+cadence-repeat. Artefacts are expected (phase 2's list).
extends = ["base"]

[run]
timeout_s = 300

[snapshot]
cadence = "repeat:3"

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 3
do = "shot"
arg = "turned"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "settled"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["start", "turned", "settled"]
