# Riverwood's river (river.toml) for water flicker: 30 shots on consecutive frames down at the water, then 30 along it, then exit.
# Score them with a tile flicker scorer. Compose it: guest+river-flicker, native-vulkan+river-flicker.
extends = ["base"]

[run]
timeout_s = 420

[[steps]]
at = "world-ready"
frames = 200
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 20
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 60
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

