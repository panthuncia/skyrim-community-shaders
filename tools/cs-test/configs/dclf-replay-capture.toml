# A DCLF pass dump for pascal-fetch-bench's replay: native D3D12 with CS_DCLF_CAPTURE,
# then dclf:capture arms the dump of the next frame's Z-prepass and main opaque passes, after the scene has settled.
# The dump goes to C:\Modding\CS-AB\replay\capture; --set env.CS_DCLF_CAPTURE=<dir> writes it elsewhere.
# Replay: pascal-fetch-bench replay <dir> (times every bucket), --check (PNGs of the replayed targets).
extends = ["native-d3d12"]

[env]
CS_DCLF_CAPTURE = "C:\\Modding\\CS-AB\\replay\\capture"

[run]
timeout_s = 420

[[steps]]
at = "world-ready"
frames = 900
do = "dclf:capture"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "captured"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
no_log = ["frame tap error"]
