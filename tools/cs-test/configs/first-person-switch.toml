# The first-person view after pov switches, back and forth twice, then in an interior after a coc. Each first-person shot should
# match the others and a load into first person. The shadow shots look down in sunlight and in Dragonsreach: the player casts
# no body shadow in first person (the engine hides the third-person root). Compose it: guest+first-person-switch, native-vulkan+first-person-switch.
extends = ["base"]

[game]
# Improved Camera SE shows the third-person body in first person (its SetFirstPerson detour patches the hide). Native runs
# turn it off (native-vulkan), so guest turns it off here too: both modes then draw the same player.
mods_off = ["Skyrim Engine Telemetry", "ImprovedCameraSE"]

[run]
timeout_s = 420

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 30
do = "pov"
arg = "first"

# Flicker through a pov switch (post-corrupt.md).
[[steps]]
at = "previous"
frames = 0
do = "burst"
arg = "pov-first:60"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "first-1"

[[steps]]
at = "previous"
frames = 1
do = "pov"
arg = "third"

[[steps]]
at = "previous"
frames = 0
do = "burst"
arg = "pov-third:60"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "third-1"

[[steps]]
at = "previous"
frames = 1
do = "pov"
arg = "first"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "first-2"

[[steps]]
at = "previous"
frames = 1
do = "pov"
arg = "third"

[[steps]]
at = "previous"
frames = 60
do = "pov"
arg = "first"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "first-3"

[[steps]]
at = "previous"
frames = 11
do = "console"
arg = "player.setangle x 70"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "first-shadow"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "held-frame"
frames = 0
do = "burst"
arg = "load-in:180"

# Facing the east aisle: straight ahead native draws the hearth fire as a ceiling-high orange column (post-refs.md, B1).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 400
do = "shot"
arg = "interior-first"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 70"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "interior-shadow"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["first-1", "third-1", "first-2", "first-3", "first-shadow", "interior-first", "interior-shadow"]

shot_refs = ["first-1", "third-1", "first-2", "first-3", "first-shadow", "interior-first", "interior-shadow"]

[expect.flicker]
max_spike = 20
max_tiles = 8
