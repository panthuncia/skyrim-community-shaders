# A save's screenshot (S15): a quicksave and an autosave through the save request pump (both wait for a save screenshot, request
# bit 29), then the newest save loaded again. A written save must hold its screenshot (tools/cs-test/essshot.py reads it from the
# .ess). The pump skips the autosave while AE 380678 is set, as it is in the lab profile, so only the quicksave is written. Native
# logs "save screenshot 1 copied by the render side, completed for the game". Compose it: native-vulkan+save-screenshot,
# guest+save-screenshot.
extends = ["base"]

[run]
timeout_s = 300

[[steps]]
at = "world-ready"
frames = 60
do = "call"
arg = "imagespace.save=quick"

[[steps]]
at = "previous"
frames = 300
do = "call"
arg = "imagespace.save=auto"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "saved"

[[steps]]
at = "previous"
frames = 30
do = "load"
arg = "recent"

[[steps]]
at = "previous"
frames = 600
do = "shot"
arg = "loaded"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["saved", "loaded"]
