# A save's screenshot (S15): an autosave and a quicksave through the save request pump (both wait for a save screenshot, request
# bit 29), then the newest save loaded again. A written save must hold its screenshot (tools/cs-test/essshot.py reads it from the
# .ess). The save's guard is hostile: without tgm the "Health Low" tutorial opens, pauses the game and the second save is refused
# (Save_Impl writes nothing while it is up). Native logs "save screenshot 1 copied by the render side, completed for the game".
# Compose it: native-vulkan+save-screenshot, guest+save-screenshot.
extends = ["base"]

[run]
timeout_s = 300

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 60
do = "call"
arg = "imagespace.save=auto"

[[steps]]
at = "previous"
frames = 300
do = "call"
arg = "imagespace.save=quick"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "saved"

[[steps]]
at = "previous"
frames = 30
do = "load"
arg = "recent"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "loaded"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["saved", "loaded"]
