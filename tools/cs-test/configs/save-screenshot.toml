# A save's screenshot (S15): an autosave and a quicksave through the save request pump (both wait for a save screenshot, request
# bit 29), then the newest save loaded again. A written save must hold its screenshot (tools/cs-test/essshot.py reads it from the
# .ess). The save's guard is hostile: without tgm the "Health Low" tutorial opens, pauses the game and the second save is refused
# (Save_Impl writes nothing while it is up). Native logs "save screenshot 1 copied by the render side, completed for the game".
# Compose it: native-vulkan+save-screenshot, guest+save-screenshot.
extends = ["base"]

[run]
timeout_s = 300

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 60
do = "call"
arg = "imagespace.save=auto"

[[steps]]
at = "previous"
frames = 300
do = "call"
arg = "imagespace.save=quick"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "saved"

[[steps]]
at = "previous"
frames = 30
do = "load"
arg = "recent"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = "loaded"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["saved", "loaded"]

shot_refs = ["saved", "loaded"]