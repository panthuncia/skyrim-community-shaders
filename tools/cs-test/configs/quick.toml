# Fast iteration: the autoloaded save, one shot a second after world-ready, then exit. Compose it: guest+quick, native-vulkan+quick.
# God mode first: the save is a guard fight, and a player who dies reloads, so the shot would show a loading screen.
extends = ["base"]

[run]
timeout_s = 300

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

# Flicker after the load (post-corrupt.md): consecutive frames from world-ready. It runs after god mode: a step after a
# burst waits for its files, and the save's guard would bring up the Health Low tutorial meanwhile.
[[steps]]
at = "previous"
frames = 0
do = "burst"
arg = "load:120"

[[steps]]
at = "previous"
frames = 60
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["start"]
shot_refs = ["start"]       # compared with refs.json's reference for the run name (README, Reference shots)

[expect.flicker]
max_spike = 20
max_tiles = 8
