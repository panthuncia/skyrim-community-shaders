# Light Limit Fix's local light shadows (frame revision plan, 6.13) in Dragonsreach, whose fires cast shadows. They start on
# (cs.llf_local_shadows: their hooks install only at startup) with DCLF off, since DCLF blocks them. Then mid-session the cache's
# resolution changes (a new version), its slot count twice in a row (a new slice count is a new texture, published again under the
# same id when its revision is adopted; the second change supersedes or follows the first), the cache goes off and on again
# (one texel while off), and every setting goes back. A shot after each.
# Compose it: guest+llf-local-shadows (the graph's cache), d3d11+llf-local-shadows (the D3D11 cache, unchanged). The native modes
# need DCLF, which blocks the cache: native-vulkan+llf-local-shadows --set dclf.enabled=true only shows the changes break nothing.
extends = ["base"]

[run]
timeout_s = 480

[dclf]
enabled = false

[cs]
llf_local_shadows = true

[features]
LightLimitFix = true

[[steps]]
at = "world-ready"
frames = 30
do = "setting"
arg = "LightLimitFix.EnableLocalShadows=true"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc WhiterunDragonsreach"

# A coc does not record a new world-ready, so the frames count from the coc.
[[steps]]
at = "previous"
frames = 600
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "LightLimitFix.LocalShadowResolution=512"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "res512"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "LightLimitFix.LocalShadowSlots=8"

[[steps]]
at = "previous"
frames = 2
do = "setting"
arg = "LightLimitFix.LocalShadowSlots=32"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "slots32"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "LightLimitFix.EnableLocalShadows=false"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "off"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "LightLimitFix.EnableLocalShadows=true"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "on"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "LightLimitFix.LocalShadowResolution=0"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "LightLimitFix.LocalShadowSlots=16"

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = "restored"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["start", "res512", "slots32", "off", "on", "restored"]
