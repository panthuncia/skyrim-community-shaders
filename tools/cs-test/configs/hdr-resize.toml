# HDR Display's textures and composite follow the display size (frame revision plan, 6.15). HDR on, a shot, a window resize
# with HDR on, a shot, then HDR off and a shot. Expect "HDR Display composes on the render graph from this frame" after the
# toggle, and after a resize that changes the back buffer "follows its adopted version (WxH)" for the three textures and a
# second "composes on the render graph" line at the new size. In guest the resize may not change the back buffer; then nothing
# follows it, which is fine. HDR shots are HDR10 PNGs. Compose it: native-vulkan+hdr-resize, native-d3d12+hdr-resize,
# guest+hdr-resize.
extends = ["base"]

[run]
timeout_s = 300

[features]
HDRDisplay = true

[[steps]]
at = "world-ready"
frames = 60
do = "hdr"
arg = "1"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "hdr"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1280x720"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "hdr-resized"

[[steps]]
at = "previous"
frames = 1
do = "hdr"
arg = "0"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "sdr-resized"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["hdr", "hdr-resized", "sdr-resized"]
no_log = ["frame tap error", "a frame declaration failed", "HDR Display returns to D3D11", "could not be made for its new key",
	"did not make"]
