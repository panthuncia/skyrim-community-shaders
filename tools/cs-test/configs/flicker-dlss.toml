# Shadow flicker: 60 shots on consecutive frames at the autoloaded save, standing still, then exit. Score the frame-to-frame
# changes per screen tile (a flicker is a tile that jumps and comes back). Compose it: native-vulkan+flicker, native-d3d12+flicker.
extends = ["base"]

[run]
timeout_s = 420

[[steps]]
at = "world-ready"
frames = 600
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 60
do = "upscale"
arg = "dlss"

[[steps]]
at = "previous"
frames = 1
do = "shot"
arg = "f00"

