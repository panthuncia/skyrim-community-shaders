# Riverwood's river around noon in a rain storm: the precipitation (rain particles, its occlusion map) over the water. Two shots along
# the river, taken apart so the rain has fallen for a while, then exit. Compose it: guest+rain, native-vulkan+rain.
extends = ["base"]

[run]
timeout_s = 420

# God mode and AI off (the save is a guard fight), so the shots compare with references. The storm is locked before the coc
# (the CS weather lock, which holds it against the climate); game time runs from 13:00, since precipitation needs it.
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 199
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "000C8220"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 60
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 90"

# The rain left to fall a while.
[[steps]]
at = "previous"
frames = 610
do = "shot"
arg = "rain"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "rain-later"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["rain", "rain-later"]

shot_refs = ["rain", "rain-later"]