# Converted from tools/cs-ab/scenarios/native.env. Old frame N became world-ready + (N - 100) for the first
# command, then each command at 'previous' plus the old gap.
# Native mode (CS_ORG_NATIVE=1, render-graph.md "Native mode"): no DXVK, BasicRHI's device, ORG presents. Native mode runs
# every port. Upscaling runs with TAA until Streamline is on the native device. Read the "[ORG native] stage" lines for how far
# the start got, and "[ORG native] ... calls" and "[ORG] tripwire:" lines for what still calls D3D11. A main menu shot, then
# Whiterun and Dragonsreach.
# ImprovedCameraSE draws through D3D11 itself (org-extension-api-notes.md, "Improved Camera SE"): off for native runs.
extends = ["native-vulkan"]

[org]
tripwire_log = true
tripwire_log_interval = 20

# A pinned scene, so the shots compare with references: god mode, AI off (the save is a guard fight), time
# stopped at 13:00, the weather locked (SkyrimClear).
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

# The save's guard may have opened the Health Low tutorial before god mode, which pauses the game and keeps the steps below
# from moving the player: health back up, the tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

# The player put back where the save has it (Save95's player location), facing one way: the fight moves and turns the
# player before AI goes off.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 400
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 200
do = "console"
arg = "coc Whiterun"

# Flicker after each load (post-corrupt.md). The nearby coc holds the presents: the burst starts at the release.
[[steps]]
at = "load-start"
frames = 0
do = "burst"
arg = "load-whiterun:180"

[[steps]]
at = "world-ready"
frames = 300
do = "shot"
arg = "whiterun"

[[steps]]
at = "previous"
frames = 400
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "held-frame"
frames = 0
do = "burst"
arg = "load-dragonsreach:180"

[[steps]]
at = "world-ready"
frames = 300
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 200
do = "exit"

[expect]
reach = "world-ready"
shots = ["start", "whiterun", "dragonsreach"]

shot_refs = ["start", "whiterun", "dragonsreach"]

[expect.flicker]
max_spike = 20
max_tiles = 8
