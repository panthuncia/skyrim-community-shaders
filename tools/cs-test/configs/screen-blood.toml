# Screen blood in first person from the autoloaded save: the player's health raised (no tgm: god mode would take no hits),
# the splatters made to last (health raised at world-ready, before a hostile guard's hits open the Health Low tutorial), one melee bandit placed at the player. After about 8 s every actor's AI is turned off and the camera
# looks down at the ground, then two shots. Placement and count are the engine's random draws: compare the splatters' look, not
# their pixels. Native draws it from game data: expect `the first screen blood run drawn by the graph`. Compose it: native-vulkan+screen-blood,
# guest+screen-blood.
extends = ["base"]

[run]
timeout_s = 300

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "player.setav health 100000"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 100000"

# Time stopped at 13:00 and the weather locked, so the shots compare with references (AI must stay on until the bandit hits).
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "setgs fBloodSplatterDuration 1000"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "setgs fBloodSplatterFadeStart 1000"

[[steps]]
at = "previous"
frames = 8
do = "pov"
arg = "first"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.placeatme 1bcd8 1"

[[steps]]
at = "previous"
frames = 470
do = "console"
arg = "tai"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle x 80"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "blood"

[[steps]]
at = "previous"
frames = 60
do = "shot"
arg = "blood2"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["blood", "blood2"]
no_log = ["frame tap error", "blood splatter: a native draw is left out: the flare", "blood splatter: a native draw is left out: no"]

[expect.graph_frames.min]
"cs.blood-splatter" = 1

shot_refs = ["blood", "blood2"]   # the splatters are random: these hold only the coarse check (8 wrong tiles at most between native runs)