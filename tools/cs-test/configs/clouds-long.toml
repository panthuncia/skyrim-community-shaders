# As clouds, with the late shot 6000 frames later: plain D3D11 compiles the 47 cloud programs with FXC first.
# Compose it: guest+clouds-long, native-vulkan+clouds-long, native-d3d12+clouds-long, d3d11+clouds-long.
extends = ["base"]

[run]
timeout_s = 600

[features]
PhysicalSky = true

[[steps]]
at = "world-ready"
frames = 30
do = "setting"
arg = "PhysicalSky.enableVolumetricClouds=true"

[[steps]]
at = "previous"
frames = 240
do = "shot"
arg = "clouds"

[[steps]]
at = "previous"
frames = 6000
do = "shot"
arg = "clouds-late"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["clouds", "clouds-late"]
