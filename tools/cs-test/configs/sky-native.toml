# The native sky's parity checks (dclf-native-sky.md): Riverwood in cloudy weather at 13:00 (the river with its reflection faces, then
# the sky), the sky on a clear night in Whiterun, away from water (night reflection faces hit a known fatal: their cloud group reaches D3D11), then Dragonsreach.
extends = ["native-vulkan"]

# God mode and AI off (the save is a guard fight; NPCs wander), so the shots compare with references.
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# tai alone leaves combat running: the save's guard keeps fighting. tcai stops it.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 499
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimCloudy_A"

[[steps]]
at = "previous"
frames = 98
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "world-ready"
frames = 60
do = "console"
arg = "set timescale to 20"

[[steps]]
at = "previous"
frames = 10
do = "weather"
arg = "SkyrimCloudy_A"

[[steps]]
at = "previous"
frames = 70
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 19
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

[[steps]]
at = "previous"
frames = 389
do = "shot"
arg = "river-noon"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle x -60"

[[steps]]
at = "previous"
frames = 290
do = "shot"
arg = "river-sky-noon"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc Whiterun"

[[steps]]
at = "world-ready"
frames = 60
do = "console"
arg = "set gamehour to 22"

[[steps]]
at = "previous"
frames = 5
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 400
do = "shot"
arg = "sky-night"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "world-ready"
frames = 300
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 100
do = "exit"

[expect]
reach = "world-ready"
shots = ["river-noon", "river-sky-noon", "sky-night", "dragonsreach"]

shot_refs = ["river-noon", "sky-night"]   # not dragonsreach (B1, the hearth fire) or river-sky-noon (B3, the player not faded at the camera); post-refs.md