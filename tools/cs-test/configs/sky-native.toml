# The native sky's parity checks (dclf-native-sky.md): Riverwood in cloudy weather at 13:00 (the river with its reflection faces, then
# the sky), the sky on a clear night in Whiterun, away from water (night reflection faces hit a known fatal: their cloud group reaches D3D11), then Dragonsreach.
extends = ["native-vulkan"]

[[steps]]
at = "world-ready"
frames = 500
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimCloudy_A"

[[steps]]
at = "previous"
frames = 98
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "previous"
frames = 1100
do = "console"
arg = "set timescale to 20"

[[steps]]
at = "previous"
frames = 10
do = "weather"
arg = "SkyrimCloudy_A"

[[steps]]
at = "previous"
frames = 70
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 19
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

[[steps]]
at = "previous"
frames = 389
do = "shot"
arg = "river-noon"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle x -60"

[[steps]]
at = "previous"
frames = 290
do = "shot"
arg = "river-sky-noon"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc Whiterun"

[[steps]]
at = "previous"
frames = 900
do = "console"
arg = "set gamehour to 22"

[[steps]]
at = "previous"
frames = 5
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 400
do = "shot"
arg = "sky-night"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "previous"
frames = 990
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 100
do = "exit"

[expect]
reach = "world-ready"
shots = ["river-noon", "river-sky-noon", "sky-night", "dragonsreach"]
