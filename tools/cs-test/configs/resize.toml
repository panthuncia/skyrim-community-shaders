# Size changes in the middle of a session: the fog volumes' grid settings (ViewAtmosphere's near and middle sizes, as the menu's sliders
# write them) and upscale method switches to FSR and to TAA (a new render size when the
# method changes). Each new size is a new version of a graph
# texture, which may only switch in at a frame boundary. The upscale switches also change the dynamic-resolution ratios that
# ImageSpace's world and chain clients follow (frame revision plan 6.7), so those register again with the revision.
# Compose it: native-vulkan+resize, native-d3d12+resize, guest+resize.
# DCLF's epochs record against each new version and switch in with it (frame revision plan, step 10b): no declared view
# mismatch, and no DCLF recording of a version the frame does not read.
extends = ["base"]

[run]
timeout_s = 300

[features]
ExponentialHeightFog = true

[[steps]]
at = "world-ready"
frames = 30
do = "setting"
arg = "ExponentialHeightFog.enabled=1"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "ExponentialHeightFog.volumetricFogEnabled=1"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "fog"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "ViewAtmosphere.nearSlices=96"

[[steps]]
at = "previous"
frames = 2
do = "setting"
arg = "ViewAtmosphere.nearSlices=100"

[[steps]]
at = "previous"
frames = 60
do = "setting"
arg = "ViewAtmosphere.nearPixelSize=12"

[[steps]]
at = "previous"
frames = 60
do = "setting"
arg = "ViewAtmosphere.middleSlices=48"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "grid"

[[steps]]
at = "previous"
frames = 1
do = "upscale"
arg = "fsr"

[[steps]]
at = "previous"
frames = 180
do = "shot"
arg = "fsr"

[[steps]]
at = "previous"
frames = 1
do = "upscale"
arg = "taa"

[[steps]]
at = "previous"
frames = 180
do = "shot"
arg = "taa"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["fog", "grid", "fsr", "taa"]
no_log = ["frame tap error", "a frame revision failed", "declared view mismatch:", "binds a version the frame does not read"]
