# Size changes in the middle of a session: Exponential Height Fog's grid settings (its volumes' extents, as the menu's sliders
# write them) and upscale method switches to FSR and to TAA (a new render size when the
# method changes). Each new size is a new version of a graph
# texture, which may only switch in at a frame boundary. Compose it: native-vulkan+resize, native-d3d12+resize, guest+resize.
extends = ["base"]

[run]
timeout_s = 300

[features]
ExponentialHeightFog = true

[[steps]]
at = "world-ready"
frames = 30
do = "setting"
arg = "ExponentialHeightFog.enabled=1"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "ExponentialHeightFog.volumetricFogEnabled=1"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "fog"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = "ExponentialHeightFog.volumetricGridSizeZ=96"

[[steps]]
at = "previous"
frames = 2
do = "setting"
arg = "ExponentialHeightFog.volumetricGridSizeZ=100"

[[steps]]
at = "previous"
frames = 60
do = "setting"
arg = "ExponentialHeightFog.volumetricGridPixelSize=12"

[[steps]]
at = "previous"
frames = 60
do = "setting"
arg = "ExponentialHeightFog.volumetricFarGridSizeZ=48"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "grid"

[[steps]]
at = "previous"
frames = 1
do = "upscale"
arg = "fsr"

[[steps]]
at = "previous"
frames = 180
do = "shot"
arg = "fsr"

[[steps]]
at = "previous"
frames = 1
do = "upscale"
arg = "taa"

[[steps]]
at = "previous"
frames = 180
do = "shot"
arg = "taa"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["fog", "grid", "fsr", "taa"]
