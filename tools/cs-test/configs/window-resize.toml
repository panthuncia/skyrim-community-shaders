# A window resize in a graph mode (phase 3 design, 6.3): CS owns the engine's targets, so a new size is a new version of each
# target, adopted with its frame revision, and the window is not held at its size. A shot, the window at 1280x720, a shot,
# 1920x1080, a shot. Expect the shots at their sizes and one "[ORG] engine target set: adopted WxH" line per resize.
# Compose it: guest+window-resize, native-vulkan+window-resize, native-d3d12+window-resize.
extends = ["base"]

[run]
timeout_s = 300

[[steps]]
at = "world-ready"
frames = 60
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1280x720"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "small"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1920x1080"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "large"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["start", "small", "large"]
no_log = ["frame tap error", "fatal: frame revision:", "the engine is creating its render targets again"]
