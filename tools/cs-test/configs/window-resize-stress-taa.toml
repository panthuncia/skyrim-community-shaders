# window-resize-stress with TAA (render size equal to display size): growing the window lost the device in native Vulkan while
# draws took the engine's live viewport (decision 112). God mode first: the save's hostile guard. Compose it:
# native-vulkan+window-resize-stress-taa.
extends = ["base"]

[run]
timeout_s = 420

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 60
do = "upscale"
arg = "taa"

[[steps]]
at = "previous"
frames = 60
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 1
do = "window"
arg = "1280x720"

[[steps]]
at = "previous"
frames = 90
do = "shot"
arg = "small0"

