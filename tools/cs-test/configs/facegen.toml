# Face tint bakes (snap3-facegen.md): the load bakes the player's head tint, and the race menu opens on the player's face
# close up and bakes it again. One shot in the race menu, then exit. The log shows each bake queued and handed to its head
# ("[Snapshot] face tint bake N") in native.

[[steps]]
at = "world-ready"
frames = 30
do = "console"
arg = "showracemenu"

[[steps]]
at = "previous"
frames = 400
do = "shot"
arg = "racemenu"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["racemenu"]
