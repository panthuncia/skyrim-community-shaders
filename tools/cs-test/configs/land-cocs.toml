# B5 hunt: the suite scene, then five rounds of native-interior's steps (Dragonsreach with its shots and Volumetric Lighting's
# custom interior size, a coc back out to Whiterun), the place logged and two shots after each coc back out, then
# one with frustum culling only and one with occlusion culling again (DCLF's epochs are built again for each). Native Vulkan.
extends = ["native-vulkan"]

# God mode first: a hostile NPC in the save can kill the player before the shots.
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

# AI off: the save's hostile guards follow into Dragonsreach and fight, which makes the shots differ between runs.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

# The rest of the suite's pinned scene (see first-person-switch): combat off, time stopped at 13:00 (the sun shafts through
# Dragonsreach's windows move with the hour), the weather locked, the Health Low tutorial closed.
[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

[[steps]]
at = "previous"
frames = 30
do = "console"
arg = 'coc WhiterunDragonsreach'

[[steps]]
at = "held-frame"
frames = 0
do = "burst"
arg = "load-in-0:180"

[[steps]]
at = "world-ready"
frames = 400
do = "shot"
arg = 'inside-0'

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = 'inside-0b'

[[steps]]
at = "previous"
frames = 10
do = "setting"
arg = 'VolumetricLighting.InteriorCustomSize={"Width":256,"Height":160,"Depth":60}'

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = 'VolumetricLighting.InteriorQuality=3'

[[steps]]
at = "previous"
frames = 300
do = "shot"
arg = 'inside-0c'

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = 'coc Whiterun'

[[steps]]
at = "held-frame"
frames = 0
do = "burst"
arg = "load-out-0:180"

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = 'fw 81a'

[[steps]]
at = "previous"
frames = 30
do = "place"
arg = 'exterior 0 +30'

[[steps]]
at = "previous"
frames = 370
do = "shot"
arg = 'exterior-0'

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = 'exterior-0b'

[[steps]]
at = "previous"
frames = 1
do = "dclf:cull"
arg = 'frustum'

[[steps]]
at = "previous"
frames = 180
do = "shot"
arg = 'exterior-0e'
wait = "settled"

[[steps]]
at = "previous"
frames = 1
do = "dclf:cull"
arg = 'occlusion'

[[steps]]
at = "previous"
frames = 180
do = "shot"
arg = 'exterior-0f'
wait = "settled"

[[steps]]
at = "previous"
frames = 1
do = "setting"
arg = 'VolumetricLighting.InteriorQuality=2'

[[steps]]
at = "previous"
