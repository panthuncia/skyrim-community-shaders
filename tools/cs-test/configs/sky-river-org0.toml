# Converted from tools/cs-ab/scenarios/sky-river-org0.env. Old frame N became world-ready + (N - 100) for the first
# command, then each command at 'previous' plus the old gap.
# The D3D11 reference for sky-river-org1.env: the engine draws the sky (CS_ORG_SKY unset), Cloud Shadows' copy on the graph in
# both. Riverwood's river by the mill in cloudy weather (SkyrimCloudy_A, locked) at 13:00 and 22:00: a shot down at the river (the water's
# reflection of the sky and its clouds, from the reflection faces) and one up at the sky each time, then Dragonsreach.
extends = ["guest"]

[org]
cloud_shadows = true

[[steps]]
at = "world-ready"
frames = 500
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimCloudy_A"

[[steps]]
at = "previous"
frames = 98
do = "console"
arg = "coc Riverwood"

[[steps]]
at = "previous"
frames = 1100
do = "console"
arg = "set timescale to 20"

[[steps]]
at = "previous"
frames = 10
do = "weather"
arg = "SkyrimCloudy_A"

[[steps]]
at = "previous"
frames = 70
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 19
do = "console"
arg = "player.setpos x 19300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -45300"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -80"

[[steps]]
at = "previous"
frames = 8
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 0"

[[steps]]
at = "previous"
frames = 389
do = "shot"
arg = "river-noon"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle x -60"

[[steps]]
at = "previous"
frames = 290
do = "shot"
arg = "river-sky-noon"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle x 12"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "set timescale to 20"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 22"

[[steps]]
at = "previous"
frames = 9
do = "weather"
arg = "SkyrimCloudy_A"

[[steps]]
at = "previous"
frames = 70
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 22"

[[steps]]
at = "previous"
frames = 299
do = "shot"
arg = "river-night"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle x -60"

[[steps]]
at = "previous"
frames = 290
do = "shot"
arg = "river-sky-night"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "previous"
frames = 990
do = "shot"
arg = "dragonsreach"

[[steps]]
at = "previous"
frames = 100
do = "exit"

[expect]
reach = "world-ready"
shots = ["river-noon", "river-sky-noon", "river-night", "river-sky-night", "dragonsreach"]
