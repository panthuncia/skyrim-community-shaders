# The update-rate cap at 30 game updates a second (Advanced, Update Rate Cap; Snapshot::PaceGameUpdate): the game runs slower than the
# render side (render-thread roadmap phase 7, item 8). The autoloaded save: a shot once settled, one three updates after a turn and one
# once that settled, then exit. Step frames count game updates. Read the [Perf] lines for "rendered" against "game ... updates/s".
# The cap holds while the render thread renders routed updates (native); the render thread's own present sets the frame rate.
# Compose it: native-vulkan+update-cap30.
extends = ["base"]

[run]
timeout_s = 300

[saved_settings.Advanced]
"Update Rate Cap" = 30

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "start"

[[steps]]
at = "previous"
frames = 10
do = "console"
arg = "player.setangle z 90"

[[steps]]
at = "previous"
frames = 3
do = "shot"
arg = "turn"

[[steps]]
at = "previous"
frames = 120
do = "shot"
arg = "settled"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"
shots = ["start", "turn", "settled"]
