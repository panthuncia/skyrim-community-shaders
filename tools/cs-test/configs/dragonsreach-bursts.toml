# Repeat breaks (F2, post-small.md): Dragonsreach, then eight 300-frame bursts of consecutive rendered frames, scored for
# one-frame breaks. Native repeat renders sometimes draw with part of the scene missing. Compose it with a mode,
# native-vulkan+dragonsreach-bursts (about one break a run) or with --set dclf.cull=frustum (several a run).

[run]
timeout_s = 900

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "world-ready"
frames = 400
do = "burst"
arg = "f2-0:300"

[[steps]]
at = "previous"
frames = 20
do = "burst"
arg = "f2-1:300"

[[steps]]
at = "previous"
frames = 20
do = "burst"
arg = "f2-2:300"

[[steps]]
at = "previous"
frames = 20
do = "burst"
arg = "f2-3:300"

[[steps]]
at = "previous"
frames = 20
do = "burst"
arg = "f2-4:300"

[[steps]]
at = "previous"
frames = 20
do = "burst"
arg = "f2-5:300"

[[steps]]
at = "previous"
frames = 20
do = "burst"
arg = "f2-6:300"

[[steps]]
at = "previous"
frames = 20
do = "burst"
arg = "f2-7:300"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"

[expect.flicker]
max_spike = 20
max_tiles = 8
