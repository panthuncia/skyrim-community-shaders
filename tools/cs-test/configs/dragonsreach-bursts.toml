# Repeat breaks (F2, post-f2.md): Dragonsreach, then eight 300-frame bursts of consecutive rendered frames, scored for
# one-frame breaks. Native repeat renders used to cull most of the near scene (the CPU pipeline's portal programs were read
# while the game thread rewrote them). Compose it with a mode: native-vulkan+dragonsreach-bursts, and with
# --set dclf.cull=frustum. Each step after a burst waits up to 180 s for its 300 PNGs (60 s was too short on a busy machine).

[run]
timeout_s = 900

[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "coc WhiterunDragonsreach"

[[steps]]
at = "world-ready"
frames = 400
do = "burst"
arg = "f2-0:300"

[[steps]]
at = "previous"
frames = 20
wait_s = 180
do = "burst"
arg = "f2-1:300"

[[steps]]
at = "previous"
frames = 20
wait_s = 180
do = "burst"
arg = "f2-2:300"

[[steps]]
at = "previous"
frames = 20
wait_s = 180
do = "burst"
arg = "f2-3:300"

[[steps]]
at = "previous"
frames = 20
wait_s = 180
do = "burst"
arg = "f2-4:300"

[[steps]]
at = "previous"
frames = 20
wait_s = 180
do = "burst"
arg = "f2-5:300"

[[steps]]
at = "previous"
frames = 20
wait_s = 180
do = "burst"
arg = "f2-6:300"

[[steps]]
at = "previous"
frames = 20
wait_s = 180
do = "burst"
arg = "f2-7:300"

[[steps]]
at = "previous"
frames = 10
wait_s = 180
do = "exit"

[expect]
reach = "world-ready"

[expect.flicker]
max_spike = 20
max_tiles = 8
