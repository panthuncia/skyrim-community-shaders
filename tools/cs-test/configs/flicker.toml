# Shadow and foliage flicker at the suite's pinned scene (the autoloaded save, standing still): a
# 120-frame burst (consecutive rendered frames, scored by cstest/flicker.py), then exit. Compose it: d3d11+flicker (the
# reference), guest+flicker, native-vulkan+flicker, native-d3d12+flicker.
extends = ["base"]

[run]
timeout_s = 420

# The suite's pinned scene (update-cap30.toml): god mode, AI and combat off, time stopped at 13:00, the weather locked,
# the Health Low tutorial closed, the player put back where the save has it.
[[steps]]
at = "world-ready"
frames = 0
do = "console"
arg = "tgm"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "tcai"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set timescale to 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "set gamehour to 13"

[[steps]]
at = "previous"
frames = 1
do = "weather"
arg = "SkyrimClear"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.restoreav health 1000"

[[steps]]
at = "previous"
frames = 30
do = "menu"
arg = "Tutorial Menu=hide"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos x 32216"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos y -16692"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setpos z -4446"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle x 0"

[[steps]]
at = "previous"
frames = 1
do = "console"
arg = "player.setangle z 200"

[[steps]]
at = "previous"
frames = 300
do = "burst"
arg = "save:120"

[[steps]]
at = "previous"
frames = 10
do = "exit"

[expect]
reach = "world-ready"

# Calibrated on d3d11 and guest at these scenes (post-flicker.md): their worst spike was 14.8 (Riverwood's turning water
# wheel at 25 frames a second), with at most 3 tiles flickering twice; native's flickering river reached 54 and 68-138 tiles.
[expect.flicker]
max_spike = 20
max_tiles = 8
